name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: diplomacyjobs
          POSTGRES_USER: diplomacyjobs
          POSTGRES_PASSWORD: diplomacyjobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diplomacyjobs"
          --health-interval 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      # Production runs on PostgreSQL; SQLite ignores max_length and folds case differently.
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://diplomacyjobs:diplomacyjobs@localhost:5432/diplomacyjobs' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test board
